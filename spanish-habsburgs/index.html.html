<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>西班牙哈布斯堡王朝：黃金世紀數位講義</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#FAF6F0] text-[#2C221E] font-['Noto_Serif_TC'] antialiased selection:bg-[#C59B27] selection:text-white">

    <!-- 頁首 Banner -->
    <header class="py-20 px-6 text-center border-b border-[#E6D7C3] bg-[linear-gradient(to_bottom,#F3EAE0,#FAF6F0)]">
        <span class="inline-block text-xs tracking-[0.3em] text-[#8C6D33] uppercase mb-3 font-semibold">Spanish Habsburg Dynasty (1516–1700)</span>
        <h1 class="text-4xl md:text-5xl font-bold text-[#7A1C1C] mb-4">西班牙哈布斯堡王朝</h1>
        <p class="max-w-2xl mx-auto text-lg text-[#5A4A42] leading-relaxed">
            走入十六至十七世紀的日不落帝國。隨著時間軸向下延伸，親歷權力巔峰、黃金藝術與帝國黃昏的壯麗史詩。
        </p>
    </header>

    <!-- 主內容區：中心時間線 -->
    <main class="max-w-6xl mx-auto px-4 py-16 relative">
        <!-- 貫穿整頁的中央金色時間軸線 -->
        <div class="absolute left-1/2 top-0 bottom-0 w-1 bg-gradient-to-b from-[#C59B27] via-[#7A1C1C] to-[#C59B27] transform -translate-x-1/2 hidden md:block"></div>

        <!-- 動態載入的時間軸事件容器 -->
        <div id="timeline-container" class="space-y-24"></div>
    </main>

    <!-- 頁尾 -->
    <footer class="py-10 text-center text-sm text-[#8C6D33] border-t border-[#E6D7C3]">
        <p>西班牙哈布斯堡王朝歷史講義 © 2026 | 規格驅動開發專案</p>
    </footer>

    <script>
        async function loadTimeline() {
            try {
                const response = await fetch('data/ch01-habsburg.json');
                const data = await response.json();
                
                const container = document.getElementById('timeline-container');
                let html = '';

                data.timelineEvents.forEach((item, index) => {
                    const isEven = index % 2 === 0;
                    const alignmentClass = isEven ? 'md:flex-row' : 'md:flex-row-reverse';
                    const textAlignment = isEven ? 'md:text-right' : 'md:text-left';

                    html += `
                        <div class="timeline-item opacity-0 translate-y-8 transition-all duration-700 ease-out relative flex flex-col md:flex-row items-center ${alignmentClass} gap-8 group">
                            <!-- 中央時間標記圓點 -->
                            <div class="absolute left-1/2 -translate-x-1/2 w-8 h-8 rounded-full bg-[#7A1C1C] border-4 border-[#FAF6F0] text-[#C59B27] flex items-center justify-center text-xs font-bold shadow-md z-10 hidden md:flex">
                                ✦
                            </div>

                            <!-- 事件文字卡片 -->
                            <div class="w-full md:w-1/2 px-4">
                                <div class="bg-white p-7 rounded-lg shadow-sm border border-[#E6D7C3] transition-transform duration-300 hover:-translate-y-1 hover:shadow-md ${textAlignment}">
                                    <span class="inline-block px-3.5 py-1 bg-[#F9F3EB] text-[#7A1C1C] font-bold text-sm rounded-full mb-3 border border-[#E6D7C3]">
                                        ${item.year}
                                    </span>
                                    <h3 class="text-2xl font-bold text-[#2C221E] mb-3">${item.title}</h3>
                                    <p class="text-[#5A4A42] leading-relaxed text-sm md:text-base">${item.content}</p>
                                </div>
                            </div>

                            <!-- 歷史名畫卡片（另一側） -->
                            <div class="w-full md:w-1/2 px-4">
                                <div class="bg-white p-3 rounded-lg shadow-sm border border-[#E6D7C3] overflow-hidden group-hover:shadow-md transition-shadow">
                                    <div class="overflow-hidden rounded h-64 bg-[#F3EAE0] flex items-center justify-center">
                                        <img src="${item.imageUrl}" alt="${item.title}" loading="lazy" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                                    </div>
                                    <p class="text-xs text-center text-[#8C6D33] mt-2.5 italic">${item.imageCaption}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
                initScrollReveal();
            } catch (error) {
                console.error('載入歷史資料失敗:', error);
            }
        }

        // 向下滑動時依序浮現的觀察器
        function initScrollReveal() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.remove('opacity-0', 'translate-y-8');
                        entry.target.classList.add('opacity-100', 'translate-y-0');
                    }
                });
            }, { threshold: 0.15 });

            document.querySelectorAll('.timeline-item').forEach(el => observer.observe(el));
        }

        window.addEventListener('DOMContentLoaded', loadTimeline);
    </script>
</body>
</html>
